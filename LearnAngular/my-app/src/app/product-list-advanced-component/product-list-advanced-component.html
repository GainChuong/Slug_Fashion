<p>product-list-advanced-component works!</p>
{{errMessage()}}
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Image</th>
            <th>Details</th>
            <th>Slug</th>
        </tr>
    </thead>
    <tbody>
        @for (p of products(); track p.id) {
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td>
                <img [src]="p.image" width="120" />
            </td>
            <td>
                <a (click)="viewDetail(p.id)" style="cursor: pointer;" title="click here to view detail">
                    View detail</a>
            </td>
            <td>
                <a (click)="viewDetailSlug(p)" style="cursor: pointer;" title="click here to view detail">
                    {{generateSlug(p.name,p.id)}}
                </a>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="3">No products available.</td>
        </tr>
        }
    </tbody>
</table>
<router-outlet></router-outlet>
